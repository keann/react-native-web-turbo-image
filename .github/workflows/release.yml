name: Release

on:
    workflow_dispatch:
        inputs:
            bump:
                description: Version bump
                type: choice
                options: [patch, minor, major]
                required: true

permissions:
    contents: read

concurrency:
    group: release

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Read the release notes
              env:
                  BUMP: ${{ inputs.bump }}
              run: |
                  # GitHub Releases render each line break, so wrapped list items are joined back.
                  perl -0pe 's/<!--.*?-->//s; s/\A\s+//; s/\s+\z/\n/; s/\n[ \t]+(?![-*+] |\d+\. )(?=\S)/ /g' \
                    UNRELEASED.md > notes.md
                  if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
                    echo "::error::UNRELEASED.md has no entries, so there is nothing to release."
                    exit 1
                  fi
                  if grep -q '^### .*Breaking Changes' notes.md && [ "$BUMP" != major ]; then
                    echo "::error::UNRELEASED.md lists breaking changes, so the release needs a major bump."
                    exit 1
                  fi

            - name: Install the Bun from packageManager
              run: npm install --global "$(jq -r .packageManager package.json)"

            - run: bun install --frozen-lockfile
            - run: bun fmt --check
            - run: bun lint
            - run: bun check
            - run: bun run test:unit

            - name: Install Chromium for the story tests
              run: bunx playwright install --with-deps chromium

            - run: bun run test:stories
            - run: bun run build
            - run: bun run test:smoke

            - name: Bump the version
              id: version
              env:
                  BUMP: ${{ inputs.bump }}
              run: echo "version=$(npm version "$BUMP" --no-git-tag-version)" >> "$GITHUB_OUTPUT"

            - name: Pack
              run: |
                  mkdir -p dist-pack
                  npm pack --pack-destination dist-pack

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release
                  path: |
                      dist-pack/*.tgz
                      notes.md
                  if-no-files-found: error

    publish:
        needs: prepare
        runs-on: ubuntu-latest
        # The environment's required reviewer approves each publish.
        environment: npm
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: release

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.22.1
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            # The `./` keeps npm from reading `dist-pack/<file>` as a GitHub repo.
            - run: npm stage publish ./dist-pack/*.tgz --provenance --access public --ignore-scripts
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    finalize:
        needs: [prepare, publish]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: release
                  path: ${{ runner.temp }}/release

            # A missed approval fails this step. Approve the staged version on npmjs.com, then re-run
            # the failed jobs of this run.
            - name: Wait for the approved version on npm
              timeout-minutes: 60
              env:
                  VERSION: ${{ needs.prepare.outputs.version }}
              run: |
                  name=$(jq -r .name package.json)
                  until npm view "$name@${VERSION#v}" version > /dev/null 2>&1; do sleep 30; done

            - name: Commit and tag the release
              env:
                  VERSION: ${{ needs.prepare.outputs.version }}
              run: |
                  npm version "$VERSION" --no-git-tag-version
                  perl -0ne 'print "$1\n" if /(<!--.*?-->)/s' UNRELEASED.md > UNRELEASED.tmp
                  mv UNRELEASED.tmp UNRELEASED.md
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git commit --all --message "Release $VERSION"
                  git tag "$VERSION"
                  # Fails without pushing anything when main moved since the run started.
                  git push --atomic origin HEAD:main "$VERSION"

            - name: Create the GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ needs.prepare.outputs.version }}
              run: gh release create "$VERSION" --title "$VERSION" --notes-file "$RUNNER_TEMP/release/notes.md"

    storybook:
        needs: [prepare, finalize]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            # The released commit, so the published Storybook matches the npm version.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.prepare.outputs.version }}

            - name: Install the Bun from packageManager
              run: npm install --global "$(jq -r .packageManager package.json)"

            - run: bun install --frozen-lockfile
            - run: bun run build:storybook

            - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: storybook-static
            - id: deploy
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
